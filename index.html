<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <meta http-equiv="refresh" content="1; url=./01gbm/">
    <title>Gestão de Serviço — 1º GBM</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        color: #111827;
        background:
          radial-gradient(circle at top, rgba(37, 99, 235, 0.14), transparent 38%),
          #f3f4f6;
      }

      main {
        width: min(100%, 420px);
        padding: 32px 28px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 22px;
        box-shadow: 0 16px 42px rgba(17, 24, 39, 0.12);
      }

      img {
        width: 76px;
        height: 76px;
        padding: 4px;
        object-fit: contain;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 50%;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 1.5rem;
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: #4b5563;
        font-size: 1rem;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        margin-top: 22px;
        padding: 11px 20px;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
        background: #2563eb;
        border-radius: 12px;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
      }

      a:hover {
        background: #1d4ed8;
      }

      a:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.35);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./01gbm/brasao.png" alt="Brasão do 1º GBM">
      <h1>Gestão de Serviço do 1º GBM</h1>
      <p>Abrindo o aplicativo de Gestão de Serviço…</p>
      <a href="./01gbm/">Acessar agora</a>
    </main>
  </body>
</html>
